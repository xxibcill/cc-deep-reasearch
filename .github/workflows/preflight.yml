name: Preflight CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Verify and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check src/ tests/

      - name: Type check
        run: uv run --frozen mypy src/

      - name: Run complete Python test suite
        run: uv run --frozen pytest
