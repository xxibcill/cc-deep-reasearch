name: Dashboard CI

on:
  push:
    branches: [main, master]
    paths:
      - "dashboard/**"
      - "src/cc_deep_research/content_gen/**"
      - "src/cc_deep_research/models/**"
      - "src/cc_deep_research/radar/**"
      - "src/cc_deep_research/web_server_routes/**"
      - "src/cc_deep_research/event_router.py"
      - "src/cc_deep_research/monitoring.py"
      - "src/cc_deep_research/web_server.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "dashboard/**"
      - "src/cc_deep_research/content_gen/**"
      - "src/cc_deep_research/models/**"
      - "src/cc_deep_research/radar/**"
      - "src/cc_deep_research/web_server_routes/**"
      - "src/cc_deep_research/event_router.py"
      - "src/cc_deep_research/monitoring.py"
      - "src/cc_deep_research/web_server.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dashboard-ci.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Block critical dependency advisories
        run: npm run audit

      - name: Lint dashboard
        run: npm run lint

      - name: Run dashboard unit tests
        run: npm test

      - name: Build dashboard
        run: npm run build

      - name: Install Playwright browser and system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run dashboard smoke tests
        run: npm run test:e2e:smoke

      - name: Run dashboard accessibility baseline
        run: npm run test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-playwright-report
          path: dashboard/playwright-report/
          if-no-files-found: ignore
